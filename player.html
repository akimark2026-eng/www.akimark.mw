<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0f" />
<title>Watch — Akimark</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

<style>
/* ============================================================
   AKIMARK — watch page
   ============================================================ */
:root {
  --bg: #0a0a0f;
  --bg-2: #12121a;
  --card: #16161f;
  --card-2: #1d1d28;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.18);
  --text: #f4f4f7;
  --muted: #9a9aae;
  --muted-2: #6b6b80;
  --brand: #E11D48;
  --brand-2: #f43f5e;
  --brand-glow: rgba(225,29,72,0.35);
  --gold: #fbbf24;
  --success: #10b981;
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(900px 500px at 20% -10%, rgba(225,29,72,0.14), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgba(99,102,241,0.10), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  background: rgba(10,10,15,0.72);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  letter-spacing: -0.4px;
  font-size: 1.1rem;
  color: var(--text);
  text-decoration: none;
  flex-shrink: 0;
}

.brand .dot {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  display: grid; place-items: center;
  color: white;
  font-size: 14px;
  box-shadow: 0 6px 20px var(--brand-glow);
}

.brand span {
  background: linear-gradient(90deg, #fff, #b8b8c8);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.topbar .spacer { flex: 1; }

.btn-ghost {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  text-decoration: none;
}

.btn-ghost:hover {
  border-color: var(--border-hover);
  background: var(--card-2);
  transform: translateY(-1px);
}

/* ============================================================
   LAYOUT
   ============================================================ */
.container {
  position: relative;
  z-index: 1;
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

/* ============================================================
   HERO / POSTER CARD
   ============================================================ */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
  gap: 32px;
  align-items: start;
  margin-bottom: 40px;
}

@media (max-width: 780px) {
  .hero { grid-template-columns: 1fr; gap: 22px; }
}

.poster-wrap {
  position: relative;
  aspect-ratio: 2 / 3;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03) inset;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(.2,.7,.2,1);
}

.poster-wrap:hover {
  transform: translateY(-4px) scale(1.01);
  border-color: var(--border-hover);
}

.poster-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.poster-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.72) 100%);
  pointer-events: none;
}

.play-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.3s ease;
  background: rgba(0,0,0,0.35);
}

.poster-wrap:hover .play-overlay { opacity: 1; }
.poster-wrap.playing .play-overlay { display: none; }

.play-ring {
  width: 76px; height: 76px;
  border-radius: 50%;
  background: rgba(255,255,255,0.14);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,0.28);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  transform: scale(0.9);
  transition: transform 0.3s ease;
}

.poster-wrap:hover .play-ring { transform: scale(1); }

.play-ring i {
  font-size: 30px;
  color: white;
  margin-left: 4px;
}

/* ============================================================
   INFO COLUMN
   ============================================================ */
.info { padding-top: 8px; }

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.badge {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
}

.badge.brand {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white;
  border-color: transparent;
  box-shadow: 0 6px 18px var(--brand-glow);
}

.badge.latest {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #1a1a1a;
  border-color: transparent;
}

.badge.hd {
  border-color: rgba(16,185,129,0.4);
  color: var(--success);
  background: rgba(16,185,129,0.08);
}

.title {
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 800;
  letter-spacing: -0.6px;
  line-height: 1.15;
  margin-bottom: 10px;
}

.title-text {
  background: linear-gradient(180deg, #ffffff 0%, #b8b8c8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  color: var(--muted);
  font-size: 0.88rem;
  margin-bottom: 18px;
  align-items: center;
}

.meta-row .dot { color: var(--muted-2); }

.rating {
  color: var(--gold);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.description {
  color: #c7c7d4;
  font-size: 0.95rem;
  line-height: 1.65;
  margin-bottom: 22px;
  max-width: 62ch;
}

/* ============================================================
   ACTION BUTTONS
   ============================================================ */
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-bottom: 26px;
}

.btn {
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.92rem;
  padding: 12px 22px;
  border-radius: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.22s ease;
  text-decoration: none;
  white-space: nowrap;
}

.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: white;
  box-shadow: 0 10px 28px var(--brand-glow);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px var(--brand-glow);
}

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--card-2);
  border-color: var(--border-hover);
  transform: translateY(-2px);
}

.btn i { font-size: 1.05em; }

/* ============================================================
   PRICE CHIP
   ============================================================ */
.price-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(251,191,36,0.08);
  border: 1px solid rgba(251,191,36,0.25);
  color: var(--gold);
  font-weight: 700;
}

.price-chip small { font-size: 0.72rem; color: var(--muted); font-weight: 600; }

.price-chip.free {
  background: rgba(16,185,129,0.08);
  border-color: rgba(16,185,129,0.28);
  color: var(--success);
}

/* ============================================================
   PLAYER SECTION
   ============================================================ */
.player-section {
  margin-top: 20px;
  border-radius: var(--radius);
  overflow: hidden;
  background: #000;
  border: 1px solid var(--border);
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  display: none;
  animation: fadeUp 0.4s ease;
}

.player-section.active { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.player-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
}

.player-head .p-title {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-head .live-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 0 0 var(--brand-glow);
  animation: pulse 1.8s infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 var(--brand-glow); }
  70%  { box-shadow: 0 0 0 12px rgba(225,29,72,0); }
  100% { box-shadow: 0 0 0 0 rgba(225,29,72,0); }
}

.video-shell {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

.video-shell video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}

/* Custom overlay when playing */
.buffer-overlay {
  position: absolute;
  inset: 0;
  display: none;
  place-items: center;
  background: rgba(0,0,0,0.55);
  z-index: 5;
  backdrop-filter: blur(4px);
}

.buffer-overlay.show { display: grid; }

.spinner {
  width: 46px; height: 46px;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   SKELETON LOADING
   ============================================================ */
.skeleton {
  background: linear-gradient(
    90deg,
    var(--card) 0%,
    var(--card-2) 50%,
    var(--card) 100%
  );
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
}

@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.sk-poster { aspect-ratio: 2/3; border-radius: var(--radius); }
.sk-line { height: 14px; margin-bottom: 10px; }
.sk-line.w-60 { width: 60%; }
.sk-line.w-40 { width: 40%; }
.sk-line.w-80 { width: 80%; }
.sk-line.h-24 { height: 24px; }
.sk-line.h-32 { height: 32px; }

/* ============================================================
   ERROR STATE
   ============================================================ */
.error-box {
  display: none;
  text-align: center;
  padding: 60px 24px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--border);
}

.error-box.show { display: block; }

.error-box i {
  font-size: 48px;
  color: var(--brand);
  margin-bottom: 16px;
  display: block;
}

.error-box h2 {
  font-size: 1.25rem;
  margin-bottom: 8px;
  font-weight: 700;
}

.error-box p {
  color: var(--muted);
  margin-bottom: 20px;
  font-size: 0.92rem;
}

/* ============================================================
   TOAST
   ============================================================ */
#toastContainer {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 340px;
}

.custom-toast {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--brand);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  animation: slideInRight 0.3s ease;
  color: var(--text);
}

.custom-toast.success { border-left-color: var(--success); }
.custom-toast.error { border-left-color: var(--brand); }

.custom-toast .toast-icon { font-size: 20px; color: var(--success); flex-shrink: 0; }
.custom-toast.error .toast-icon { color: var(--brand); }

.custom-toast .toast-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
.custom-toast .toast-msg { font-size: 0.82rem; color: var(--muted); }

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes slideOutRight {
  to { opacity: 0; transform: translateX(30px); }
}

/* ============================================================
   DEV BANNER
   ============================================================ */
.dev-banner {
  display: none;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #1a1a1a;
  padding: 8px 16px;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.dev-banner.show { display: block; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 600px) {
  .container { padding: 16px 14px 60px; }
  .topbar { padding: 12px 14px; }
  .title { font-size: 1.5rem; }
  .actions .btn { flex: 1; justify-content: center; }
  #toastContainer { left: 12px; right: 12px; max-width: none; }
}
</style>
</head>
<body>

<!-- ============================================================
     DEV BANNER
     ============================================================ -->
<div class="dev-banner" id="devBanner">
  <i class="bi bi-tools"></i> Testing Mode — Localhost
</div>

<!-- ============================================================
     TOP BAR
     ============================================================ -->
<header class="topbar">
  <a href="/" class="brand">
    <span class="dot"><i class="bi bi-play-fill"></i></span>
    <span>Akimark</span>
  </a>
  <div class="spacer"></div>
  <a href="/" class="btn-ghost">
    <i class="bi bi-arrow-left"></i> Back
  </a>
</header>

<!-- ============================================================
     MAIN CONTAINER
     ============================================================ -->
<main class="container">

  <!-- HERO (poster + info) -->
  <section class="hero" id="heroSection">

    <!-- Poster column -->
    <div id="posterCol">
      <div class="poster-wrap skeleton sk-poster" id="posterWrap"></div>
    </div>

    <!-- Info column -->
    <div class="info" id="infoCol">
      <div class="badges">
        <div class="skeleton sk-line" style="width:80px; height:22px; border-radius:999px;"></div>
        <div class="skeleton sk-line" style="width:60px; height:22px; border-radius:999px;"></div>
      </div>
      <div class="skeleton sk-line h-32 w-80"></div>
      <div class="skeleton sk-line h-24 w-60" style="margin-bottom:20px;"></div>
      <div class="skeleton sk-line w-80"></div>
      <div class="skeleton sk-line w-80"></div>
      <div class="skeleton sk-line w-60" style="margin-bottom:24px;"></div>
      <div class="skeleton" style="width:180px; height:46px; border-radius:12px;"></div>
    </div>
  </section>

  <!-- Error state -->
  <div class="error-box" id="errorBox">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <h2 id="errorTitle">Something went wrong</h2>
    <p id="errorMessage">We couldn't load this film.</p>
    <button class="btn btn-primary" onclick="location.reload()">
      <i class="bi bi-arrow-clockwise"></i> Try Again
    </button>
  </div>

  <!-- Player section (hidden until Play clicked) -->
  <section class="player-section" id="playerSection">
    <div class="player-head">
      <div class="p-title">
        <span class="live-dot"></span>
        <span id="playerTitle">Now Playing</span>
      </div>
      <button class="btn-ghost" id="closePlayerBtn">
        <i class="bi bi-x-lg"></i> Close
      </button>
    </div>
    <div class="video-shell">
      <video
        id="player"
        controls
        controlsList="nodownload noplaybackrate noremoteplayback"
        disablePictureInPicture
        playsinline
        preload="metadata"
        crossorigin="anonymous"
        poster=""
      ></video>
      <div class="buffer-overlay" id="bufferOverlay">
        <div class="spinner"></div>
      </div>
    </div>
  </section>

</main>

<div id="toastContainer"></div>

<!-- ============================================================
     CONFIG + PLAYER SCRIPT
     ============================================================ -->
<script src="config.js"></script>
<script>
/* ============================================================
   AKIMARK WATCH PAGE — bootstrap
   ============================================================ */
(function () {
  'use strict';

  // -------- CONFIG DETECTION (testing vs production) --------
  const HOST = location.hostname;
  const IS_DEV =
    HOST === 'localhost' ||
    HOST === '127.0.0.1' ||
    HOST.endsWith('.workers.dev') ||
    HOST.endsWith('.pages.dev');

  if (IS_DEV) {
    document.getElementById('devBanner').classList.add('show');
  }

  // -------- DOM --------
  const posterWrap  = document.getElementById('posterWrap');
  const infoCol     = document.getElementById('infoCol');
  const heroSection = document.getElementById('heroSection');
  const errorBox    = document.getElementById('errorBox');
  const errorTitle  = document.getElementById('errorTitle');
  const errorMsg    = document.getElementById('errorMessage');
  const playerSec   = document.getElementById('playerSection');
  const playerEl    = document.getElementById('player');
  const playerTitle = document.getElementById('playerTitle');
  const bufferOv    = document.getElementById('bufferOverlay');
  const closeBtn    = document.getElementById('closePlayerBtn');
  const toastBox    = document.getElementById('toastContainer');

  // -------- SUPABASE --------
  const SUPABASE_URL      = window.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    return showError('Configuration missing', 'Supabase keys are not set in config.js');
  }

  // -------- TOAST --------
  function showToast({ type = 'success', title = '', message = '' }) {
    const toast = document.createElement('div');
    toast.className = `custom-toast ${type}`;
    const icon = type === 'success' ? 'bi-check-circle-fill' : 'bi-x-circle-fill';
    toast.innerHTML = `
      <div class="toast-icon"><i class="bi ${icon}"></i></div>
      <div class="toast-content">
        <div class="toast-title">${escapeHtml(title)}</div>
        <div class="toast-msg">${escapeHtml(message)}</div>
      </div>
    `;
    toastBox.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideOutRight 0.35s ease forwards';
      setTimeout(() => toast.remove(), 400);
    }, 4500);
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // -------- ERROR STATE --------
  function showError(title, message) {
    heroSection.style.display = 'none';
    errorBox.classList.add('show');
    errorTitle.textContent = title;
    errorMsg.textContent = message;
  }

  // -------- HELPERS --------
  function formatDuration(mins) {
    if (!mins || mins <= 0) return null;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function formatPrice(p) {
    if (!p || p <= 0) return null;
    return `MK ${Number(p).toLocaleString('en-MW')}`;
  }

  function getVideoIdFromURL() {
    const params = new URLSearchParams(location.search);
    // Support ?id=xxx, ?video=xxx, ?v=xxx
    return params.get('id') || params.get('video') || params.get('v');
  }

  // ============================================================
  // FETCH VIDEO METADATA (from videos_public view, falls back to videos)
  // ============================================================
  async function fetchVideo(videoId) {
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Accept': 'application/json',
    };

    // Try `videos_public` first (no video_key exposure)
    const url = `${SUPABASE_URL}/rest/v1/videos_public?id=eq.${encodeURIComponent(videoId)}&select=*&limit=1`;

    let res = await fetch(url, { headers });
    if (!res.ok) {
      // Fallback to base table (in case the view doesn't exist yet)
      const url2 = `${SUPABASE_URL}/rest/v1/videos?id=eq.${encodeURIComponent(videoId)}&select=id,title,genre,year,duration,quality,description,price,poster_url,category,featured,latest,episode_number,series_id,translator_name,view_count,created_at&limit=1`;
      res = await fetch(url2, { headers });
    }

    if (!res.ok) {
      const text = await res.text();
      throw new Error(`Failed to fetch video: ${res.status} ${text.slice(0, 120)}`);
    }

    const rows = await res.json();
    if (!rows || rows.length === 0) {
      throw new Error('Video not found');
    }
    return rows[0];
  }

  // ============================================================
  // RENDER METADATA
  // ============================================================
  function renderPoster(video) {
    const posterUrl = video.poster_url || '';

    posterWrap.classList.remove('skeleton', 'sk-poster');
    posterWrap.classList.add('poster-wrap');
    posterWrap.innerHTML = `
      <img
        src="${escapeHtml(posterUrl)}"
        alt="${escapeHtml(video.title)}"
        loading="eager"
        onerror="this.style.display='none';this.parentElement.classList.add('no-poster');"
      />
      <div class="play-overlay">
        <div class="play-ring">
          <i class="bi bi-play-fill"></i>
        </div>
      </div>
    `;

    // Fallback if no poster
    if (!posterUrl) {
      posterWrap.style.background = 'linear-gradient(135deg, #1a1a24, #0d0d14)';
      posterWrap.innerHTML = `
        <div style="position:absolute;inset:0;display:grid;place-items:center;color:#3a3a48;font-size:56px;">
          <i class="bi bi-film"></i>
        </div>
        <div class="play-overlay">
          <div class="play-ring"><i class="bi bi-play-fill"></i></div>
        </div>
      `;
    }
  }

  function renderInfo(video) {
    const genres = (video.genre || '').split(',').map(s => s.trim()).filter(Boolean);
    const categories = (video.category || '').split(',').map(s => s.trim()).filter(Boolean);
    const duration = formatDuration(video.duration);
    const price = formatPrice(video.price);

    const badges = [];
    if (video.latest) badges.push(`<span class="badge latest"><i class="bi bi-lightning-fill"></i> Latest</span>`);
    if (video.quality) badges.push(`<span class="badge hd"><i class="bi bi-badge-hd-fill"></i> ${escapeHtml(video.quality)}</span>`);
    if (video.episode_number) badges.push(`<span class="badge">E${escapeHtml(String(video.episode_number))}</span>`);
    categories.slice(0, 3).forEach(c => {
      badges.push(`<span class="badge brand">${escapeHtml(c)}</span>`);
    });

    const metaParts = [];
    if (video.year) metaParts.push(`<span>${escapeHtml(video.year)}</span>`);
    if (duration) metaParts.push(`<span class="dot">•</span><span>${escapeHtml(duration)}</span>`);
    if (genres.length) metaParts.push(`<span class="dot">•</span><span>${escapeHtml(genres.join(' · '))}</span>`);
    if (video.translator_name) metaParts.push(`<span class="dot">•</span><span><i class="bi bi-person-fill"></i> ${escapeHtml(video.translator_name)}</span>`);
    if (video.view_count) metaParts.push(`<span class="dot">•</span><span><i class="bi bi-eye-fill"></i> ${Number(video.view_count).toLocaleString()}</span>`);

    const priceChip = price
      ? `<div class="price-chip"><small>Price</small>${escapeHtml(price)}</div>`
      : `<div class="price-chip free"><i class="bi bi-unlock-fill"></i> Free</div>`;

    infoCol.innerHTML = `
      <div class="badges">${badges.join('')}</div>

      <h1 class="title">
        <span class="title-text">${escapeHtml(video.title || 'Untitled')}</span>
      </h1>

      <div class="meta-row">
        <span class="rating"><i class="bi bi-star-fill"></i> 8.5</span>
        ${metaParts.join(' ')}
      </div>

      <p class="description">
        ${escapeHtml(video.description || 'No description available for this film.')}
      </p>

      <div class="actions">
        <button class="btn btn-primary" id="playBtn">
          <i class="bi bi-play-fill"></i> Play Now
        </button>
        ${priceChip}
      </div>
    `;

    // Wire play button
    document.getElementById('playBtn').addEventListener('click', () => startPlayback(video));
    // Wire poster click
    posterWrap.addEventListener('click', () => startPlayback(video), { once: false });
  }

  // ============================================================
  // PLAYER SESSION (calls player-session-api)
  // ============================================================
  const userToken = localStorage.getItem('akmark_token');

  async function getStreamSession(videoId) {
    const res = await fetch(
      `${SUPABASE_URL}/functions/v1/player-session-api`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(userToken ? { Authorization: 'Bearer ' + userToken } : {}),
        },
        body: JSON.stringify({ video_id: videoId }),
      }
    );
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Session failed (${res.status})`);
    return data;
  }

  // ============================================================
  // START PLAYBACK
  // ============================================================
  let sessionRefreshTimer = null;
  let currentVideoId = null;

  async function startPlayback(video) {
    if (currentVideoId === video.id && playerSec.classList.contains('active')) {
      // Already playing
      return;
    }

    const playBtn = document.getElementById('playBtn');
    if (playBtn) { playBtn.disabled = true; playBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Loading...'; }

    bufferOv.classList.add('show');
    playerSec.classList.add('active');
    playerTitle.textContent = video.title || 'Now Playing';

    // Scroll player into view
    setTimeout(() => {
      playerSec.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);

    try {
      const session = await getStreamSession(video.id);

      // Set poster on player
      if (video.poster_url) playerEl.poster = video.poster_url;

      playerEl.src = session.streamUrl;
      playerEl.load();

      // Wait until can play
      await new Promise((resolve, reject) => {
        const onCanPlay = () => { cleanup(); resolve(); };
        const onError = () => { cleanup(); reject(new Error('Failed to load video stream')); };
        const cleanup = () => {
          playerEl.removeEventListener('canplay', onCanPlay);
          playerEl.removeEventListener('error', onError);
        };
        playerEl.addEventListener('canplay', onCanPlay);
        playerEl.addEventListener('error', onError);
        // Timeout safety
        setTimeout(() => { cleanup(); reject(new Error('Video load timeout')); }, 30000);
      });

      bufferOv.classList.remove('show');
      posterWrap.classList.add('playing');
      currentVideoId = video.id;

      try { await playerEl.play(); } catch {}

      // Setup auto-refresh
      scheduleSessionRefresh(video.id, session.expiresIn);

      showToast({
        type: 'success',
        title: 'Playback started',
        message: `Now streaming "${video.title}"`,
      });

      // Re-enable play button
      if (playBtn) { playBtn.disabled = false; playBtn.innerHTML = '<i class="bi bi-play-fill"></i> Play Now'; }

    } catch (err) {
      console.error('Playback error:', err);
      bufferOv.classList.remove('show');
      playerSec.classList.remove('active');
      posterWrap.classList.remove('playing');
      currentVideoId = null;

      if (playBtn) { playBtn.disabled = false; playBtn.innerHTML = '<i class="bi bi-play-fill"></i> Play Now'; }

      showToast({
        type: 'error',
        title: 'Playback failed',
        message: err.message || 'Could not start playback',
      });
    }
  }

  function scheduleSessionRefresh(videoId, expiresIn) {
    if (sessionRefreshTimer) clearTimeout(sessionRefreshTimer);
    // Refresh 15 min before expiry
    const refreshMs = Math.max((expiresIn - 900) * 1000, 60_000);

    sessionRefreshTimer = setTimeout(async () => {
      try {
        const fresh = await getStreamSession(videoId);
        const wasPlaying = !playerEl.paused;
        const curTime = playerEl.currentTime;
        const wasMuted = playerEl.muted;

        playerEl.src = fresh.streamUrl;
        playerEl.currentTime = curTime;
        playerEl.muted = wasMuted;

        if (wasPlaying) {
          try { await playerEl.play(); } catch {}
        }

        scheduleSessionRefresh(videoId, fresh.expiresIn);
      } catch (e) {
        console.error('Session refresh failed:', e);
        // Retry after 60s
        sessionRefreshTimer = setTimeout(() => scheduleSessionRefresh(videoId, 1800), 60_000);
      }
    }, refreshMs);
  }

  // ============================================================
  // CLOSE PLAYER
  // ============================================================
  closeBtn.addEventListener('click', () => {
    try { playerEl.pause(); } catch {}
    playerEl.removeAttribute('src');
    playerEl.load();
    if (sessionRefreshTimer) { clearTimeout(sessionRefreshTimer); sessionRefreshTimer = null; }
    playerSec.classList.remove('active');
    posterWrap.classList.remove('playing');
    currentVideoId = null;
  });

  // Buffer overlay when stalling during playback
  playerEl.addEventListener('waiting', () => bufferOv.classList.add('show'));
  playerEl.addEventListener('playing', () => bufferOv.classList.remove('show'));
  playerEl.addEventListener('canplay', () => bufferOv.classList.remove('show'));

  // ============================================================
  // BOOT
  // ============================================================
  (async function boot() {
    const videoId = getVideoIdFromURL();
    if (!videoId) {
      showError('No video selected', 'Open this page with ?id=<video_id> in the URL.');
      return;
    }

    try {
      const video = await fetchVideo(videoId);
      document.title = `${video.title} — Akimark`;

      renderPoster(video);
      renderInfo(video);

      // Auto-play if ?autoplay=1
      if (new URLSearchParams(location.search).get('autoplay') === '1') {
        startPlayback(video);
      }
    } catch (err) {
      console.error(err);
      showError('Film not found', err.message || 'We could not find this film.');
    }
  })();
})();
</script>
</body>
